services:
  postgres:
    image: postgres:15-alpine
    container_name: workouts_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: workouts_db
      POSTGRES_USER: workouts_user
      POSTGRES_PASSWORD: workouts_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workouts_user -d workouts_db"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: